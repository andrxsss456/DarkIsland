<script id="chunk-worker"
type="javascript/worker">

function noise(x,z){

    return (

        Math.sin(x*0.05)
        +
        Math.cos(z*0.04)
        +
        Math.sin((x+z)*0.03)

    ) * 0.5;

}


function getHeight(x,z){

    const r =
    Math.sqrt(
        x*x + z*z
    );

    const island =
        40 -
        r*0.1;

    return Math.max(

        0,

        island +
        noise(x,z)*5

    );

}


function generateChunkData(cx,cz){

    const CHUNK_SIZE = 16;

    const voxels = [];

    for(let x=0;x<CHUNK_SIZE;x++){

        for(let z=0;z<CHUNK_SIZE;z++){

            const wx =
            cx*CHUNK_SIZE+x;

            const wz =
            cz*CHUNK_SIZE+z;

            const height =
            Math.floor(
                getHeight(wx,wz)
            );

            voxels.push({

                x,
                z,
                height

            });

        }

    }

    return {

        cx,
        cz,

        voxels

    };

}


self.onmessage = e=>{

    const {cx,cz} =
    e.data;

    const chunk =
    generateChunkData(
        cx,
        cz
    );

    self.postMessage(chunk);

};

</script>

function createPineTree(){

}


function createDeadTree(){

    const trunk =

        new THREE.CylinderGeometry(

            5,
            6

        );

            3+i*0.5,

            0

        );


        branch.rotation.z =
        0.7;


        group.add(

    }

}


function createTwistedTree(){

function createTree(

    y,

){

            TREE_TYPES.length

    if(type === "pine"){

        createPineTree();

    }

    else if(type === "dead"){

        treeMesh =
        createDeadTree();

    }

    else{

        treeMesh =
        createTwistedTree();

    }


    treeMesh.position.set(
        x,
        y,
        z
    );


    if(chunk){

        chunk.group.add(
            treeMesh

    }

    else{

        scene.add(
            treeMesh
        );

    }


    const tree = {

        x,
        y,
        z,

        radius:0.7,

        height:4,

        type,

        mesh:treeMesh,

        chunk

    };


    trees.push(tree);


    if(chunk){

        chunk.trees.push(
            tree
        );

    }


    return tree;

}


/* =====================================================
   ROCAS
===================================================== */

function createRock(
    x,
    y,
    z,
    chunk=null
){

    const geo =
    new THREE.IcosahedronGeometry(
        1.5,
        1
    );


    const pos =
    geo.attributes.position;


    for(
        let i=0;
        i<pos.count;
        i++
    ){

        pos.setXYZ(

            i,

            pos.getX(i) +
            (Math.random()-0.5)*0.3,

            pos.getY(i) +
            (Math.random()-0.5)*0.2,

            pos.getZ(i) +
            (Math.random()-0.5)*0.3

        );

    }


    pos.needsUpdate = true;


    const rock =
    new THREE.Mesh(

        geo,

        new THREE.MeshStandardMaterial({

            color:0x595959

        })

    );


    rock.position.set(

        x,
        y+1,
        z

    );


    if(chunk){

        chunk.group.add(
            rock
        );

    }

    else{

        scene.add(
            rock
        );

    }


    const data = {

        x,
        y,
        z,

        radius:1.6,

        mesh:rock,

        chunk

    };


    rocks.push(data);


    if(chunk){

        chunk.rocks.push(data);

    }


    return data;

}

function createBush(x, y, z, chunk = null) {

    const group = new THREE.Group();

    const material = new THREE.MeshStandardMaterial({
        color: 0x294b20,
        roughness: 1
    });

    // Tres volúmenes vegetales para formar el arbusto.
    for (let i = 0; i < 3; i++) {

        const leaves = new THREE.Mesh(
            new THREE.IcosahedronGeometry(
                0.65 + Math.random() * 0.3,
                1
            ),
            material
        );

        leaves.position.set(
            (Math.random() - 0.5) * 0.8,
            0.35 + Math.random() * 0.3,
            (Math.random() - 0.5) * 0.8
        );

        leaves.scale.y = 0.7;
        leaves.castShadow = true;

        group.add(leaves);
    }

    group.position.set(x, y, z);

    if (chunk) {
        chunk.group.add(group);

            chunk.bushes = [];

        scene.add(group);
    }

    const bush = {
        x,
        y,
        z,
        radius: 1,
        mesh: group,
        chunk

    bushes.push(bush);

    if (chunk) {
        chunk.bushes.push(bush);
    }

    return bush;
}

function createRuin(

){

        const wall =

    }

            ruin
        );

    }


    ruins.push({

        x,
        y,
        z,

        mesh:ruin,

        chunk

    });


    if(chunk){

        chunk.ruins.push(
            ruins[ruins.length-1]
        );

    }


    return ruin;

}


/* =====================================================
   COLISIONES
===================================================== */




const PLAYER_RADIUS = 0.42;
const PLAYER_HEIGHT = 2;
const MAX_STEP_HEIGHT = 1.05;

function circleTouchesBox(px, pz, radius, minX, maxX, minZ, maxZ) {
    const closestX = Math.max(minX, Math.min(px, maxX));
    const closestZ = Math.max(minZ, Math.min(pz, maxZ));

    const dx = px - closestX;
    const dz = pz - closestZ;

    return dx * dx + dz * dz < radius * radius;
}

function collideTrees(x, z) {
    for (const tree of trees) {
        const dx = x - tree.x;
        const dz = z - tree.z;
        const radius = (tree.radius || 0.7) + PLAYER_RADIUS;

        if (dx * dx + dz * dz < radius * radius) {
            return true;
        }
    }

    return false;
}

function collideRocks(x, z) {
    for (const rock of rocks) {
        const dx = x - rock.x;
        const dz = z - rock.z;
        const radius = (rock.radius || 1.6) * 0.82 + PLAYER_RADIUS;

        if (dx * dx + dz * dz < radius * radius) {
            return true;
        }
    }

    return false;
}

function collideRuins(x, z) {
    for (const ruin of ruins) {
        if (circleTouchesBox(
            x, z, PLAYER_RADIUS,
            ruin.x - 0.5,
            ruin.x + 10.5,
            ruin.z - 2.15,
            ruin.z + 2.15
        )) {
            return true;
        }
    }

    return false;
}

function collidesWithObjects(x, z) {
    return (
        collideTrees(x, z) ||
        collideRocks(x, z) ||
        collideRuins(x, z)
    );
}

function getGroundHeight(x, z) {
    return Math.floor(getHeight(x, z));
}



/* =====================================================
   CUEVAS
===================================================== */

function generateCaves(chunk){

    for(let i=0;i<4;i++){

        const x =
        chunk.cx*
        CHUNK_SIZE +
        Math.random()*
        CHUNK_SIZE;


        const z =
        chunk.cz*
        CHUNK_SIZE +
        Math.random()*
        CHUNK_SIZE;


        const y =
        getHeight(x,z)-6;


        const cave = {

            x,
            y,
            z,

            radius:
            4+Math.random()*6,

            chunk

        };


        caves.push(cave);

        chunk.caves.push(cave);


        createCaveMesh(
            cave
        );

    }

}


function createCaveMesh(cave){

    const mesh =
    new THREE.Mesh(

        new THREE.SphereGeometry(

            cave.radius,

            24,
            24

        ),

        new THREE.MeshStandardMaterial({

            color:0x151515,

            side:
            THREE.BackSide

        })

    );


    mesh.position.set(

        cave.x,
        cave.y,
        cave.z

    );


    cave.mesh =
    mesh;


    cave.chunk.group.add(
        mesh
    );

}


function insideCave(
    x,
    y,
    z
){

    for(
        const cave of caves
    ){

        const dx =
        x-cave.x;

        const dy =
        y-cave.y;

        const dz =
        z-cave.z;


        const d =
        Math.sqrt(

            dx*dx+
            dy*dy+
            dz*dz

        );


        if(
            d<cave.radius
        ){

            return cave;

        }

    }


    return null;

}


/* =====================================================
   COLISIÓN CÁMARA
===================================================== */

function cameraBlocked(
    x,
    y,
    z
){

    for(
        const rock of rocks
    ){

        const dx =
        x-rock.x;

        const dz =
        z-rock.z;


        if(

            dx*dx+
            dz*dz

            <

            (rock.radius+
            cameraCollisionRadius)*
            (rock.radius+
            cameraCollisionRadius)

        ){

            return true;

        }

    }


    for(
        const tree of trees
    ){

        const dx =
        x-tree.x;

        const dz =
        z-tree.z;


        if(

            dx*dx+
            dz*dz

            <

            (tree.radius+
            cameraCollisionRadius)*
            (tree.radius+
            cameraCollisionRadius)

        ){

            return true;

        }

    }


    return false;

}


function cameraCollision(){

    const cave =
    insideCave(

        camera.position.x,
        camera.position.y,
        camera.position.z

    );


    if(cave){

        camera.position.lerp(

/* =====================================================
   CONSTRUCCIÓN DE CHUNK DESDE WORKER
===================================================== */

function buildChunkMesh(
    data
){

    const key =
    chunkKey(
        data.cx,
        data.cz
    );


    if(
        chunks.has(key)
    ){

        return;

    }


    const group =
    new THREE.Group();


    const chunk = {

        cx:data.cx,
        cz:data.cz,

        group,

        trees:[],
        rocks:[],
        caves:[],
        ruins:[]

    };


    scene.add(
        group
    );


    for(
        const voxel of data.voxels
    ){

        const h =
        voxel.height;


        if(h<=0)
            continue;


        const wx =
        data.cx*
        CHUNK_SIZE+
        voxel.x;


        const wz =
        data.cz*
        CHUNK_SIZE+
        voxel.z;


        const material =
        new THREE.MeshStandardMaterial({

            color:
            h<2
            ?
            0xff7722
            :
            0x253120

        });


        const ground =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1,
                h,
                1
            ),

            material

        );


        ground.position.set(

            wx,
            h/2,
            wz

        );


        group.add(
            ground
        );

    }


    chunks.set(
        key,
        chunk
    );

        const nearestZ = Math.max(minZ, Math.min(z, maxZ));

        const dx = x - nearestX;
        const dz = z - nearestZ;

        if (dx * dx + dz * dz < radius * radius) {
            return false;
        }
    }

    return true;
}

function generateChunkObjects(chunk) {

    // ÁRBOLES
    for (let i = 0; i < 4; i++) {

        const x =
            chunk.cx * CHUNK_SIZE +
            Math.random() * CHUNK_SIZE;

        const z =
            chunk.cz * CHUNK_SIZE +
            Math.random() * CHUNK_SIZE;

        const height = getHeight(x, z);

        if (height > 3 && Math.random() < 0.10) {
            createTree(x, height, z, chunk);
        }

        // RUINAS
        if (Math.random() < 0.02) {
            createRuin(x, height, z, chunk);
        }
    }

    // ROCAS
    for (let i = 0; i < 2; i++) {

        const x =
            chunk.cx * CHUNK_SIZE +
            Math.random() * CHUNK_SIZE;

        const z =
            chunk.cz * CHUNK_SIZE +
            Math.random() * CHUNK_SIZE;

        const height = getHeight(x, z);

        if (height > 1) {
            createRock(x, height, z, chunk);
        }
    }

    // ARBUSTOS
    chunk.bushes = [];

    for (let i = 0; i < 12; i++) {

        const x =
            chunk.cx * CHUNK_SIZE +
            Math.random() * CHUNK_SIZE;

        const z =
            chunk.cz * CHUNK_SIZE +
            Math.random() * CHUNK_SIZE;

        const height = getHeight(x, z);

        if (height > 1) {
            const bush = createBush(x, height, z, chunk);

            if (bush) {
                chunk.bushes.push(bush);
            }
        }
    }
}
/* =====================================================
   SOLICITAR CHUNK
===================================================== */

function requestChunk(
    cx,
    cz
){

    const key =
    chunkKey(cx,cz);


    if(
        chunks.has(key)
    ){

        return;

    }


    if(

        chunkQueue.some(
            task =>
            task.cx===cx &&
            task.cz===cz
        )

    ){

        return;

    }


    chunkQueue.push({

        cx,
        cz

    });


    worker.postMessage({

        cx,
        cz

    });

}


/* =====================================================
   PROCESAR COLA
===================================================== */

function processChunkQueue(){

    let generated = 0;


    while(

        chunkQueue.length &&
        generated<1

    ){

        const task =
        chunkQueue.shift();


        /*
           El Worker procesa la geometría de datos.
           Aquí sólo marcamos el trabajo como iniciado.
        */

        generated++;

    }

}


/* =====================================================
   CARGAR CHUNK
===================================================== */

function loadChunk(
    cx,
    cz
){

    requestChunk(
        cx,
        cz
    );

}


/* =====================================================
   DESCARGAR CHUNK
===================================================== */

function unloadChunk(
    cx,
    cz
){

    const key =
    chunkKey(cx,cz);


    const chunk =
    chunks.get(key);


    if(!chunk)
        return;


    for(
        const tree of chunk.trees
    ){

        const i =
        trees.indexOf(tree);

        if(i!==-1){

            trees.splice(
                i,
                1
            );

        }

    }


    for(
        const rock of chunk.rocks
    ){

        const i =
        rocks.indexOf(rock);

        if(i!==-1){

            rocks.splice(
                i,
                1
            );

        }

    }


    for(
        const cave of chunk.caves
    ){

        const i =
        caves.indexOf(cave);

        if(i!==-1){

            caves.splice(
                i,
                1
            );

        }

    }


    for(
        const ruin of chunk.ruins
    ){

        const i =
        ruins.indexOf(ruin);

        if(i!==-1){

            ruins.splice(
                i,
                1
            );

        }

    }

for (const bush of chunk.bushes || []) {
    const i = bushes.indexOf(bush);

    if (i !== -1) {
        bushes.splice(i, 1);
    }
}
    scene.remove(
        chunk.group
    );


    chunk.group.traverse(
        object=>{

            if(object.geometry){

                object.geometry.dispose();

            }

            if(object.material){

                if(
                    Array.isArray(
                        object.material
                    )
                ){

                    object.material.forEach(
                        m=>m.dispose()
                    );

                }
                else{

                    object.material.dispose();

                }

            }

        }
    );


    chunks.delete(
        key
    );

}


/* =====================================================
   ACTUALIZAR CHUNKS
===================================================== */

function updateChunks(){

    const pcx =
    Math.floor(

        player.x /
        CHUNK_SIZE

    );


    const pcz =
    Math.floor(

        player.z /
        CHUNK_SIZE

    );


    const needed =
    new Set();


    for(

        let x=-RENDER_DISTANCE;
        x<=RENDER_DISTANCE;
        x++

    ){

        for(

            let z=-RENDER_DISTANCE;
            z<=RENDER_DISTANCE;
            z++

        ){

            const cx =
            pcx+x;


            const cz =
            pcz+z;


            const key =
            chunkKey(cx,cz);


            needed.add(
                key
            );


            loadChunk(
                cx,
                cz
            );

        }

    }


    for(
        const key of [...chunks.keys()]
    ){

        if(
            !needed.has(key)
        ){

            const parts =
            key.split(",");


            unloadChunk(

                Number(parts[0]),
                Number(parts[1])

            );

        }

    }

}

/* =====================================================
   FÍSICA
===================================================== */


const gravity = 22;
let lastFrameTime = performance.now();
let jumpWasDown = false;

function updatePlayer(dt) {
    const speed = 6.2;

    let moveX = 0;
    let moveZ = 0;

    const fx = Math.sin(cameraYaw);
    const fz = Math.cos(cameraYaw);

    const rx = Math.sin(cameraYaw + Math.PI / 2);
    const rz = Math.cos(cameraYaw + Math.PI / 2);

    if (keys.KeyW || keys.ArrowUp) {
        moveX += fx;
        moveZ += fz;
    }

    if (keys.KeyS || keys.ArrowDown) {
        moveX -= fx;
        moveZ -= fz;
    }

if (keys.KeyA || keys.ArrowLeft)  { 
        moveX += rx; moveZ += rz; }
        
if (keys.KeyD || keys.ArrowRight) { 
        moveX -= rx; moveZ -= rz; }

    // Normalizar movimiento diagonal.
    const length = Math.hypot(moveX, moveZ);

    if (length > 0) {
        moveX = moveX / length * speed * dt;
        moveZ = moveZ / length * speed * dt;
    }

    const oldGround = getGroundHeight(player.x, player.z);

    // Colisión horizontal con el eje X.
    const nextX = player.x + moveX;

    if (moveX !== 0 &&
        !collidesWithObjects(nextX, player.z)) {

        const nextGround = getGroundHeight(nextX, player.z);

        if (!player.grounded ||
            nextGround <= oldGround + MAX_STEP_HEIGHT) {
            player.x = nextX;
        }
    }

    // Colisión horizontal con el eje Z.
    const currentGround = getGroundHeight(player.x, player.z);
    const nextZ = player.z + moveZ;

    if (moveZ !== 0 &&
        !collidesWithObjects(player.x, nextZ)) {

        const nextGround = getGroundHeight(player.x, nextZ);

        if (!player.grounded ||
            nextGround <= currentGround + MAX_STEP_HEIGHT) {
            player.z = nextZ;
        }
    }

    // Saltar una sola vez por pulsación.
    const jumpDown = !!keys.Space;

    if (jumpDown && !jumpWasDown && player.grounded) {
        player.velY = 8.2;
        player.grounded = false;
    }

    jumpWasDown = jumpDown;

    // Física vertical independiente de los FPS.
    player.velY -= gravity * dt;
    player.y += player.velY * dt;

    const ground = getGroundHeight(player.x, player.z);
    const feetY = player.y - PLAYER_HEIGHT / 2;

    // Aterrizaje sobre la superficie del terreno.
    if (feetY <= ground && player.velY <= 0) {
        player.y = ground + PLAYER_HEIGHT / 2;
        player.velY = 0;
        player.grounded = true;
    } else {
        player.grounded = false;
    }

    // Reinicio si cae al vacío o llega a la lava.
    if (player.y < -30 || ground <= LAVA_LEVEL) {
        player.x = 0;
        player.z = 0;
        player.y = getGroundHeight(0, 0) +
                   PLAYER_HEIGHT / 2 + 0.1;

        player.velY = 0;
        player.grounded = true;
    }

    playerMesh.position.set(
        player.x,
        player.y,
        player.z
    );
}



/* =====================================================
   CÁMARA NUEVA
===================================================== */

const cameraPosition =
new THREE.Vector3();


function updateCamera(){

    let desiredDistance =
    8;


    for(

        let d=desiredDistance;

        d>1;

        d-=0.2

    ){

        const tx =
        player.x-
        Math.sin(cameraYaw)*d;


        const ty =
        player.y+3;


        const tz =
        player.z-
        Math.cos(cameraYaw)*d;


        if(

            !cameraBlocked(
                tx,
                ty,
                tz
            )

        ){

            desiredDistance =
            d;

            break;

        }

    }


    const desiredPosition =
    new THREE.Vector3(

        player.x-
        Math.sin(cameraYaw)*
        desiredDistance,

        player.y+3,

        player.z-
        Math.cos(cameraYaw)*
        desiredDistance

    );


    cameraPosition.lerp(

        desiredPosition,

        0.08

    );


    camera.position.lerp(

        cameraPosition,

        0.08

    );


    camera.lookAt(

        player.x,
        player.y+1,
        player.z

    );

}

/* =====================================================
   MINIMAPA AVANZADO: DARK ISLAND
===================================================== */

const minimapCanvas =
    document.getElementById("minimapCanvas");

const minimapCtx =
    minimapCanvas.getContext("2d");

function updateMinimap() {
    const ctx = minimapCtx;
    const size = minimapCanvas.width;
    const center = size / 2;

    // Escala: píxeles por unidad del mundo.
    const scale = 1.5;
    const viewRadius = center / scale;

    ctx.clearRect(0, 0, size, size);

    // Limitar todo el dibujo al círculo.
    ctx.save();
    ctx.beginPath();
    ctx.arc(center, center, center, 0, Math.PI * 2);
    ctx.clip();

    // Fondo del terreno.
    ctx.fillStyle = "#18251a";
    ctx.fillRect(0, 0, size, size);

    // Convertir coordenadas del mundo a coordenadas del mapa.
    function mapX(x) {
        return center + (x - player.x) * scale;
    }

    function mapZ(z) {
        return center + (z - player.z) * scale;
    }

    // Borde aproximado de la isla.
    // Según getHeight(), el terreno llega a altura cero
    // aproximadamente a 400 unidades del origen.
    const islandRadius = 400;
    const islandCenterX = mapX(0);
    const islandCenterZ = mapZ(0);

    ctx.beginPath();
    ctx.arc(
        islandCenterX,
        islandCenterZ,
        islandRadius * scale,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle = "#e0c78a";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Cuadrícula de referencia.
    ctx.strokeStyle = "rgba(190, 210, 190, 0.13)";
    ctx.lineWidth = 1;

    const gridSize = 16 * scale;
    const offsetX =
        ((player.x % 16) + 16) % 16 * scale;
    const offsetZ =
        ((player.z % 16) + 16) % 16 * scale;

    for (
        let x = center - offsetX;
        x < size;
        x += gridSize
    ) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, size);
        ctx.stroke();
    }

    for (
        let z = center - offsetZ;
        z < size;
        z += gridSize
    ) {
        ctx.beginPath();
        ctx.moveTo(0, z);
        ctx.lineTo(size, z);
        ctx.stroke();
    }

    // Dibujar árboles.
    for (const tree of trees) {
        const x = mapX(tree.x);
        const z = mapZ(tree.z);

        if (
            Math.abs(x - center) > center ||
            Math.abs(z - center) > center
        ) continue;

        ctx.fillStyle =
            tree.type === "dead" ? "#b7a17c" : "#64cf55";

        ctx.beginPath();
        ctx.arc(x, z, 2.5, 0, Math.PI * 2);
        ctx.fill();
    }
// Dibujar arbustos.
for (const bush of bushes) {
    const x = mapX(bush.x);
    const z = mapZ(bush.z);

    if (
        Math.abs(x - center) > center ||
        Math.abs(z - center) > center
    ) continue;

    ctx.fillStyle = "#a4d65e";
    ctx.beginPath();
    ctx.arc(x, z, 1.8, 0, Math.PI * 2);
    ctx.fill();
}
    // Dibujar rocas.
    for (const rock of rocks) {
        const x = mapX(rock.x);
        const z = mapZ(rock.z);

        if (
            Math.abs(x - center) > center ||
            Math.abs(z - center) > center
        ) continue;

        ctx.fillStyle = "#b5b5b5";
        ctx.beginPath();
        ctx.arc(x, z, 3, 0, Math.PI * 2);
        ctx.fill();
    }

    // Dibujar ruinas.
    for (const ruin of ruins) {
        const x = mapX(ruin.x);
        const z = mapZ(ruin.z);

        if (
            Math.abs(x - center) > center ||
            Math.abs(z - center) > center
        ) continue;

        ctx.fillStyle = "#e7a64a";
        ctx.fillRect(x - 4, z - 3, 8, 6);
        ctx.strokeStyle = "#4a3020";
        ctx.strokeRect(x - 4, z - 3, 8, 6);
    }

    // Dibujar cuevas registradas.
    for (const cave of caves) {
        const x = mapX(cave.x);
        const z = mapZ(cave.z);

        if (
            Math.abs(x - center) > center ||
            Math.abs(z - center) > center
        ) continue;

        ctx.fillStyle = "#d16bff";
        ctx.beginPath();
        ctx.arc(x, z, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#f0d5ff";
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    // Indicador de dirección del jugador.
    ctx.save();
    ctx.translate(center, center);
    ctx.rotate(-cameraYaw);

    ctx.fillStyle = "#ff4141";
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1;

    ctx.beginPath();
    ctx.moveTo(0, -11);
    ctx.lineTo(-7, 7);
    ctx.lineTo(0, 4);
    ctx.lineTo(7, 7);
    ctx.closePath();

    ctx.fill();
    ctx.stroke();
    ctx.restore();

    // Punto central del jugador.
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(center, center, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}
/* =====================================================
   LOD
===================================================== */

function updateLOD(){

    for(
        const tree of trees
    ){

        const d =
        tree.mesh.position.distanceTo(
            camera.position
        );


        tree.mesh.visible =
        d<100;

    }


    for(
        const rock of rocks
    ){

        const d =
        rock.mesh.position.distanceTo(
            camera.position
        );


        rock.mesh.visible =
        d<80;

    }

}


/* =====================================================
   GUARDADO
===================================================== */

function saveGame(){

    localStorage.setItem(

        "darkIslandSave",

        JSON.stringify({

            x:player.x,
            y:player.y,
            z:player.z

        })

    );

}


setInterval(

    saveGame,

    10000

);


function loadGame(){

    const raw =
    localStorage.getItem(
        "darkIslandSave"
    );


    if(!raw)
        return;


    try{

        const save =
        JSON.parse(raw);


        player.x =
        save.x;

        player.y =
        save.y;

        player.z =
        save.z;

    }
    catch(error){

        console.warn(
            "Guardado inválido",
            error
        );

    }

}

/* =====================================================
   ANIMACIÓN DE PARTÍCULAS
===================================================== */

function updateParticles(){

    for(
        const sprite of particles
    ){

        sprite.position.y +=
        0.003;


        if(
            sprite.position.y>30
        ){

            sprite.position.y=0;

        }

    }

}


/* =====================================================
   LOOP
===================================================== */


function loop() {
    const now = performance.now();

    const dt = Math.min(
        (now - lastFrameTime) / 1000,
        0.05
    );

    lastFrameTime = now;

    updatePlayer(dt);

    updateChunks();
processChunkQueue();
updateCamera();
updateMinimap();
cameraCollision();
updateLOD();
updateParticles();

    lavaMaterial.uniforms.time.value =
        performance.now() * 0.001;

    renderer.render(scene, camera);

    requestAnimationFrame(loop);
}



/* =====================================================
   INICIO
===================================================== */

loadGame();


loop();
