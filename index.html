<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dark Island Raycasting</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
}

canvas{
    display:block;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
addEventListener("resize",resize);

const SIZE = 64;

const WATER = 0;
const LAND = 1;
const ROCK = 2;

const map = [];

for(let y=0;y<SIZE;y++){

    map[y] = [];

    for(let x=0;x<SIZE;x++){

        const dx = x - SIZE/2;
        const dy = y - SIZE/2;

        const dist = Math.sqrt(dx*dx + dy*dy);

        let radius = 25 + Math.sin(x*0.4)*3 + Math.cos(y*0.3)*3;

        if(dist > radius){

            map[y][x] = WATER;

        }else{

            if(Math.random() < 0.08)
                map[y][x] = ROCK;
            else
                map[y][x] = LAND;
        }

    }
}

const player = {
    x:32,
    y:32,
    angle:0,
    speed:0.08
};

const keys = {};

onkeydown = e => keys[e.key.toLowerCase()] = true;
onkeyup   = e => keys[e.key.toLowerCase()] = false;

function walkable(x,y){

    const mx = Math.floor(x);
    const my = Math.floor(y);

    if(!map[my]) return false;

    return map[my][mx] !== ROCK;
}

function update(){

    if(keys["a"]) player.angle -= 0.04;
    if(keys["d"]) player.angle += 0.04;

    let dx = Math.cos(player.angle);
    let dy = Math.sin(player.angle);

    if(keys["w"]){

        let nx = player.x + dx * player.speed;
        let ny = player.y + dy * player.speed;

        if(walkable(nx,ny)){
            player.x = nx;
            player.y = ny;
        }
    }

    if(keys["s"]){

        let nx = player.x - dx * player.speed;
        let ny = player.y - dy * player.speed;

        if(walkable(nx,ny)){
            player.x = nx;
            player.y = ny;
        }
    }
}

function drawSky(){

    let g = ctx.createLinearGradient(
        0,0,
        0,canvas.height/2
    );

    g.addColorStop(0,"#02040a");
    g.addColorStop(1,"#0b1524");

    ctx.fillStyle = g;
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height/2
    );

    ctx.fillStyle = "#f5f5dc";

    ctx.beginPath();
    ctx.arc(
        canvas.width*0.78,
        canvas.height*0.18,
        35,
        0,
        Math.PI*2
    );
    ctx.fill();

    for(let i=0;i<120;i++){

        let x = (i*337)%canvas.width;
        let y = (i*173)%250;

        ctx.fillStyle = "white";
        ctx.fillRect(x,y,1,1);
    }
}

function drawGround(){

    let g = ctx.createLinearGradient(
        0,
        canvas.height/2,
        0,
        canvas.height
    );

    g.addColorStop(0,"#233320");
    g.addColorStop(1,"#161d15");

    ctx.fillStyle = g;
    ctx.fillRect(
        0,
        canvas.height/2,
        canvas.width,
        canvas.height/2
    );
}

function raycast(){

    drawSky();
    drawGround();

    const FOV = Math.PI/3;
    const MAX_DIST = 28;

    for(let x=0;x<canvas.width;x++){

        let angle =
        player.angle -
        FOV/2 +
        (x/canvas.width)*FOV;

        let dist = 0;
        let hit = false;
        let type = WATER;

        while(!hit && dist < MAX_DIST){

            dist += 0.04;

            const rx =
            player.x +
            Math.cos(angle)*dist;

            const ry =
            player.y +
            Math.sin(angle)*dist;

            const mx = Math.floor(rx);
            const my = Math.floor(ry);

            if(!map[my]) break;

            if(map[my][mx] === ROCK){

                type = ROCK;
                hit = true;
            }
        }

        if(hit){

            let corrected =
            dist *
            Math.cos(angle-player.angle);

            let h =
            canvas.height /
            corrected;

            let fog =
            Math.max(
                0,
                1 - dist/MAX_DIST
            );

            let r = 90*fog;
            let g = 95*fog;
            let b = 100*fog;

            ctx.fillStyle =
            `rgb(${r},${g},${b})`;

            ctx.fillRect(
                x,
                canvas.height/2 - h/2,
                1,
                h
            );
        }
    }
}

function minimap(){

    const s = 4;

    for(let y=0;y<SIZE;y++){

        for(let x=0;x<SIZE;x++){

            let c = "#1f3f80";

            if(map[y][x]===LAND)
                c="#274a24";

            if(map[y][x]===ROCK)
                c="#666";

            ctx.fillStyle=c;

            ctx.fillRect(
                x*s,
                y*s,
                s,
                s
            );
        }
    }

    ctx.fillStyle="red";

    ctx.beginPath();
    ctx.arc(
        player.x*s,
        player.y*s,
        3,
        0,
        Math.PI*2
    );
    ctx.fill();
}

function loop(){

    update();

    raycast();

    minimap();

    requestAnimationFrame(loop);
}

loop();

</script>
</body>
</html>
