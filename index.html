<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dark Island</title>

<style>
html,body{
    margin:0;
    overflow:hidden;
    background:#000;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<script>

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
addEventListener("resize",resize);

const SIZE = 256;

const heightmap = [];

for(let y=0;y<SIZE;y++){

    heightmap[y] = [];

    for(let x=0;x<SIZE;x++){

        const dx = x - SIZE/2;
        const dy = y - SIZE/2;

        const dist = Math.sqrt(dx*dx + dy*dy);

        let h =
        70 -
        dist +
        Math.sin(x*0.12)*8 +
        Math.cos(y*0.12)*8;

        heightmap[y][x] = Math.max(0,h);
    }
}

const player = {
    x:128,
    y:128,
    angle:0,
    z:35
};

const keys = {};

onkeydown=e=>keys[e.key.toLowerCase()]=1;
onkeyup=e=>keys[e.key.toLowerCase()]=0;

function update(){

    if(keys.a) player.angle-=0.03;
    if(keys.d) player.angle+=0.03;

    let speed=1.2;

    if(keys.w){
        player.x+=Math.cos(player.angle)*speed;
        player.y+=Math.sin(player.angle)*speed;
    }

    if(keys.s){
        player.x-=Math.cos(player.angle)*speed;
        player.y-=Math.sin(player.angle)*speed;
    }

}

function drawSky(){

    let g = ctx.createLinearGradient(
        0,0,
        0,canvas.height
    );

    g.addColorStop(0,"#000000");
    g.addColorStop(0.4,"#180000");
    g.addColorStop(1,"#4b1200");

    ctx.fillStyle=g;
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );
}

function drawLava(){

    ctx.fillStyle="#ffae42";

    ctx.fillRect(
        0,
        canvas.height*0.55,
        canvas.width,
        canvas.height
    );
}

function renderTerrain(){

    const horizon =
    canvas.height*0.52;

    for(let sx=0;sx<canvas.width;sx++){

        let ray =
        player.angle
        -0.8
        +(sx/canvas.width)*1.6;

        let maxY =
        canvas.height;

        for(let d=2;d<200;d+=0.5){

            let wx =
            player.x +
            Math.cos(ray)*d;

            let wy =
            player.y +
            Math.sin(ray)*d;

            let ix=wx|0;
            let iy=wy|0;

            if(
                ix<0||
                iy<0||
                ix>=SIZE||
                iy>=SIZE
            )continue;

            let h =
            heightmap[iy][ix];

            if(h<8)
                continue;

            let screenY =
            horizon -
            ((h-player.z)/d)*250;

            if(screenY<maxY){

                let fog =
                1-d/200;

                let r =
                20*fog;

                let g =
                25*fog;

                let b =
                18*fog;

                ctx.fillStyle=
                `rgb(${r},${g},${b})`;

                ctx.fillRect(
                    sx,
                    screenY,
                    1,
                    maxY-screenY
                );

                maxY=screenY;
            }
        }
    }
}

function drawMoon(){

    ctx.fillStyle="#ffd38a";

    ctx.beginPath();
    ctx.arc(
        canvas.width*0.8,
        canvas.height*0.22,
        50,
        0,
        Math.PI*2
    );

    ctx.fill();
}

function drawFog(){

    let g = ctx.createLinearGradient(
        0,
        canvas.height*0.4,
        0,
        canvas.height
    );

    g.addColorStop(0,
        "rgba(255,120,0,0)"
    );

    g.addColorStop(1,
        "rgba(255,120,0,0.18)"
    );

    ctx.fillStyle=g;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );
}

function loop(){

    update();

    drawSky();
    drawLava();
    renderTerrain();
    drawMoon();
    drawFog();

    requestAnimationFrame(loop);
}

loop();

</script>
</body>
</html>
